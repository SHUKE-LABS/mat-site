name: Purchase route guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  purchase-route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard the purchase route
        run: |
          set -euo pipefail

          if git grep -n -E 'LEMONSQUEEZY_CHECKOUT|lemonsqueezy\.com/checkout' -- src; then
            echo '::error::The site still contains a removed static Lemon Squeezy checkout link.'
            exit 1
          fi

          if ! git grep -n 'href="/buy"' -- src/components/Nav.astro src/pages/index.astro; then
            echo '::error::The site has no /buy purchase link.'
            exit 1
          fi
